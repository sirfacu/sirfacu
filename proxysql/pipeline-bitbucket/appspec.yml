version: 0.0
os: linux
files:
  - source: /
    destination: /tmp/proxysql-data
    
file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: _pipeline/server-get-tags.sh
      timeout: 300
      runas: root
    - location: _pipeline/server_stop.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: _pipeline/after_install.sh
      timeout: 300
      runas: root
